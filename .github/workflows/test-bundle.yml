name: Test bundle (Android release wait)

on:
  push:
    branches: [android-release-wait]
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_COMMIT: b1a8996cb336f8398b06583c399fae821523152d
  TEST_VERSION: 0.4.901

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        target: [android, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host tools
        env:
          CROSS: ${{ matrix.target == 'linux' && 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libwayland-dev' || '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build flex bison glslang-tools pkg-config python3-pip $CROSS
          sudo python3 -m pip install --break-system-packages --quiet 'meson>=1.5' mako pyyaml packaging
      - name: Android NDK r26d
        if: matrix.target == 'android'
        id: ndk
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true
      - name: Mesa at the DD-Turnip 0.4.0 commit
        run: scripts/fetch_mesa.sh mesa "$MESA_COMMIT"
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          scripts/build_${{ matrix.target }}.sh mesa
          tail -5 work/${{ matrix.target }}/patch.log
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-*
          path: out
          merge-multiple: true
      - name: Package bundle
        run: |
          set -euo pipefail
          ls -R out
          grep -a -q "DroidDeck test: release image waits" out/android/libvulkan_freedreno.so && grep -a -q "DroidDeck test: acquire waits" out/android/libvulkan_freedreno.so
          scripts/fetch_mesa.sh mesa "$MESA_COMMIT"
          python3 scripts/package_bundle.py --version "$TEST_VERSION" --mesa-commit "$MESA_COMMIT" \
            --mesa-version "$(tr -d '[:space:]' < mesa/VERSION)" --mesa-src mesa
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: DD-Turnip-v0.4.901-release-wait
          path: |
            dist/DD-Turnip-v0.4.901.zip
            dist/DD-Turnip-v0.4.901.zip.sha256
